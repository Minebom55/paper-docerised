services:
  survival:
    build: ./base
    volumes:
      - ./mcserver/survival:/docker/server
    ports:
      - '25567:25567'
      - '25575:25575'
    environment:
    #Set to false to disable the server
    #Also comment out port and rcon_port above
      - enabled="true"
    
      - port=25567
      - rcon_port=25575
      - MC_VERSION=1.21.11
      #amount in GB minimum 1Gb
      - MC_RAM=4
      - PROJECT_ID=
      - MODRINTH_PROJECTS=Vebnzrzj,P1OZGk5p,GM9AuKjX
      
  creative:
    build: ./base
    volumes:
      - ./mcserver/creative:/docker/server
    ports:
      - '25566:25566'
      - '25576:25576'
    environment:
    #Set to false to disable the server
    #Also comment out port and rcon_port above
      - enabled="true"

      - port=25566
      - rcon_port=25576
      - MC_VERSION=1.21.11
      #amount in GB minimum 1Gb
      - MC_RAM=4
      - PROJECT_ID=
      - MODRINTH_PROJECTS=Vebnzrzj,P1OZGk5p,GM9AuKjX,1u6JkXh5

  velocity:
    build: ./velocity
    volumes:
      - ./mcserver/velocity:/docker/server
    ports:
      - '25565:25565'
#      - '25576:25576'
    environment:
    #Set to false to disable the server
    #Also comment out port and rcon_port above
      - enabled="true"

      - servers_ports=survival:25567,creative:25566
      - port=25566
#      - rcon_port=25576
      - MC_VERSION=1.21.11
      - velocity_version=4.0.0
      #amount in GB minimum 1Gb
      - MC_RAM=4
      - PROJECT_ID=
      - MODRINTH_PROJECTS=P1OZGk5p,Vebnzrzj