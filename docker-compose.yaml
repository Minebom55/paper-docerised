services:
  survival:
    stdin_open: true
    build: ./base
    volumes:
      - ./mcserver/survival:/docker/server
      - ./mcserver/custom_plugins/survival:/docker/custom_plugins
    ports:
      #- '25567:25567'
      - '25575:25575'
    environment:
    #Set to false to disable the server
    #Also comment out port and rcon_port above
      - enabled="true"

      - velocity_secret=osmjc1ePCtyo #Replace with your actual secret key for Velocity
    
      - reset_properties="true"
      - reset_paper_config="true"
      - server_port=25565
      - rcon_port=25575
      - MC_VERSION=1.21.11
      #amount in GB minimum 1Gb
      - MC_RAM=4
      - PROJECT_ID=
      - MODRINTH_PROJECTS=Vebnzrzj,P1OZGk5p,GM9AuKjX
      
  creative:
    stdin_open: true
    build: ./base
    volumes:
      - ./mcserver/creative:/docker/server
      - ./mcserver/custom_plugins/creative:/docker/custom_plugins
    ports:
      #- '25566:25566'
      - '25576:25576'
    environment:
    #Set to false to disable the server
    #Also comment out port and rcon_port above
      - enabled="true"

      - velocity_secret=osmjc1ePCtyo #Replace with your actual secret key for Velocity. located in mcseerver/velocity/forwarding.secret

      - reset_properties="true"
      - reset_paper_config="true"
      - server_port=25565
      - rcon_port=25576
      - MC_VERSION=1.21.11
      #amount in GB minimum 1Gb
      - MC_RAM=4
      - PROJECT_ID=
      - MODRINTH_PROJECTS=Vebnzrzj,P1OZGk5p,GM9AuKjX,1u6JkXh5

  velocity:
    build: ./velocity
    volumes:
      - ./mcserver/velocity:/docker/server
      - ./mcserver/custom_plugins/velocity:/docker/custom_plugins 
    ports:
      - '25565:25565'
#      - '25576:25576'
    environment:
    #Set to false to disable the server
    #Also comment out port and rcon_port above
      - reset_toml="false"
      - enabled="true"

      - servers_ports=survival:25565,creative:25565
      - port=25565
#      - rcon_port=25576
      - MC_VERSION=1.21.11
      - velocity_version=4.0.0
      #amount in Megabytes minimum 256M
      - MC_RAM=512
      - PROJECT_ID=
      - MODRINTH_PROJECTS=P1OZGk5p,Vebnzrzj